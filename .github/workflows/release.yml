name: Build release zip

# Release a new version either way:
#   A) push a tag:            git tag v1.3.0 && git push origin v1.3.0
#   B) or publish a Release on GitHub with tag v1.3.0
# The tag must match "Version:" and WPPE_VERSION in wp-pro-post-expiry.php.
# This workflow builds wp-pro-post-expiry.zip, creates the Release if needed
# (notes taken from CHANGELOG.md) and attaches the zip. Sites running the plugin
# then see "Update now" on their Plugins page.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check version matches tag
        run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' wp-pro-post-expiry.php | awk '{print $NF}')
          const=$(grep -m1 "define( 'WPPE_VERSION'" wp-pro-post-expiry.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          tag="${TAG#v}"
          echo "tag=$tag header=$header constant=$const"
          if [ "$tag" != "$header" ] || [ "$tag" != "$const" ]; then
            echo "::error::Tag $TAG does not match Version header ($header) / WPPE_VERSION ($const)"; exit 1
          fi

      - name: Lint PHP
        run: for f in *.php; do php -l "$f"; done

      - name: Build zip
        run: |
          mkdir -p build/wp-pro-post-expiry
          cp wp-pro-post-expiry.php uninstall.php README.md CHANGELOG.md build/wp-pro-post-expiry/
          cd build && zip -r ../wp-pro-post-expiry.zip wp-pro-post-expiry

      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md

      - name: Create release (if missing) and attach zip
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "WP Pro Post Expiry ${TAG#v}" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" wp-pro-post-expiry.zip --clobber
